[project]
name = "gmail-calendar"
version = "0.1.0"
description = "MCP server (stdio) for Gmail search/read/drafts and Google Calendar"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[tool.uv]
package = false
